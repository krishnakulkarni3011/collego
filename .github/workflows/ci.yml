name: Collego CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ─── Environment matrix ───────────────────────────────────────────────────────
# Secrets expected in GitHub repo settings:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   ECR_REGISTRY  (e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com)
#   EC2_INSTANCE_ID   (SSM-managed EC2 instance used for deploy)
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD   (RDS endpoint for prod)
#   JWT_SECRET
#   ADMIN_EMAIL, ADMIN_PASSWORD
#   VITE_API_URL  (e.g. https://api.collego.example.com)
#   S3_BUCKET_NAME  (main bucket, kept for legacy; individual buckets below)
#   OPENROUTER_API_KEY  (Phase 9: LLM for AI notice generator — optional, stub used if blank)
#
# Deployment:
#   The deploy job uploads docker-compose.prod.yml, infra/nginx/ and a generated
#   deploy.sh to s3://collego-db-backups-prod/deploy/. It then runs the script on
#   the EC2 instance through AWS Systems Manager (SSM). No inbound SSH is needed.
#   The live /opt/collego/.env is NOT overwritten by CI; it stays the single
#   source of production secrets (Groq key, Gmail app password, DB password, ...).
#   EC2_HOST, EC2_USER and EC2_SSH_KEY are no longer used by the deploy job.

jobs:
  # ═══════════════════════════════════════════════════════════
  #  1. BACKEND — Build, Test, Package
  # ═══════════════════════════════════════════════════════════
  backend-build:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: collego_test
          POSTGRES_USER: collego
          POSTGRES_PASSWORD: collego123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & package with Maven
        run: mvn clean package -B -DskipTests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: collego_test
          DB_USERNAME: collego
          DB_PASSWORD: collego123
          JWT_SECRET: ci-test-jwt-secret-at-least-256-bits-long-000000000000000

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 3

  # ═══════════════════════════════════════════════════════════
  #  2. FRONTEND — Build
  # ═══════════════════════════════════════════════════════════
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Empty = same-origin; Nginx on EC2 proxies /api/* → backend:8080
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # ═══════════════════════════════════════════════════════════
  #  3. AI SERVICE — Lint / Syntax check
  # ═══════════════════════════════════════════════════════════
  ai-service-check:
    name: AI Service — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py && echo "Syntax OK"

  # ═══════════════════════════════════════════════════════════
  #  4. DOCKER BUILD & PUSH TO ECR  (main branch only)
  # ═══════════════════════════════════════════════════════════
  docker-build-push:
    name: Docker — Build & Push to ECR
    needs: [backend-build, frontend-build, ai-service-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: tags
        run: |
          echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT

      # ── Backend image ───────────────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.tags.outputs.REGISTRY }}/collego-backend:latest
            ${{ steps.tags.outputs.REGISTRY }}/collego-backend:${{ steps.tags.outputs.SHA }}

      # ── Frontend image ──────────────────────────────────────
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            # Empty VITE_API_URL = same-origin; Nginx routes /api/* to backend
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ steps.tags.outputs.REGISTRY }}/collego-frontend:latest
            ${{ steps.tags.outputs.REGISTRY }}/collego-frontend:${{ steps.tags.outputs.SHA }}

      # ── AI Service image ────────────────────────────────────
      - name: Build & push ai-service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: |
            ${{ steps.tags.outputs.REGISTRY }}/collego-ai-service:latest
            ${{ steps.tags.outputs.REGISTRY }}/collego-ai-service:${{ steps.tags.outputs.SHA }}

  # ═══════════════════════════════════════════════════════════
  #  5. DEPLOY TO EC2 VIA SSM  (main branch only, after ECR push)
  # ═══════════════════════════════════════════════════════════
  deploy:
    name: Deploy to EC2 via SSM
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Upload the compose file, nginx config and a generated deploy script.
      # The EC2 instance pulls these from S3 via SSM — no inbound SSH needed.
      - name: Upload deploy assets to S3
        run: |
          set -euo pipefail
          BUCKET="collego-db-backups-prod"
          PREFIX="deploy"

          aws s3 cp docker-compose.prod.yml "s3://${BUCKET}/${PREFIX}/docker-compose.prod.yml"
          aws s3 sync infra/nginx/ "s3://${BUCKET}/${PREFIX}/infra/nginx/" --delete

          cat > deploy.sh <<'DEPLOY_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd /opt/collego

          IMAGE_TAG="__IMAGE_TAG__"
          REGION="ap-south-1"
          BUCKET="collego-db-backups-prod"
          PREFIX="deploy"

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          export ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
          export IMAGE_TAG

          aws s3 cp "s3://${BUCKET}/${PREFIX}/docker-compose.prod.yml" ./docker-compose.prod.yml
          mkdir -p infra/nginx
          aws s3 sync "s3://${BUCKET}/${PREFIX}/infra/nginx/" ./infra/nginx/ --delete

          aws ecr get-login-password --region "${REGION}" | \
            docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker exec collego-nginx nginx -s reload 2>/dev/null || true

          echo "Deployment complete: ${IMAGE_TAG} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DEPLOY_SCRIPT

          sed -i "s/__IMAGE_TAG__/${GITHUB_SHA::7}/" deploy.sh
          aws s3 cp deploy.sh "s3://${BUCKET}/${PREFIX}/deploy.sh"

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          BUCKET="collego-db-backups-prod"
          PREFIX="deploy"

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Collego deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters 'commands=["aws s3 cp s3://collego-db-backups-prod/deploy/deploy.sh /tmp/collego-deploy.sh && chown ec2-user:ec2-user /tmp/collego-deploy.sh && sudo -u ec2-user bash /tmp/collego-deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: ${COMMAND_ID}"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "SSM status: ${STATUS} (attempt ${i}/90)"

            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM deployment failed with status ${STATUS}"
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out waiting for SSM command ${COMMAND_ID}"
          exit 1

      - name: Verify public health endpoints
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            API=$(curl -fsS https://65-0-244-196.sslip.io/api/health || true)
            AI=$(curl -fsS https://65-0-244-196.sslip.io/ai/health || true)
            if echo "${API}" | grep -q '"status":"UP"' && echo "${AI}" | grep -q '"status":"UP"'; then
              echo "Health checks passed"
              exit 0
            fi
            echo "Waiting for health checks (attempt ${i}/30)"
            sleep 10
          done
          echo "::error::Public health checks did not pass"
          exit 1
