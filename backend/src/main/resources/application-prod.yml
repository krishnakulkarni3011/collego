# application-prod.yml
# Production Spring profile — activated when SPRING_PROFILES_ACTIVE=prod
# All sensitive values come from environment variables injected by docker compose

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate          # NEVER use update/create in prod
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8080
  error:
    include-message: never      # don't leak stack traces in prod
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 2048

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000    # 15 minutes
  refresh-token-expiration: 604800000 # 7 days

collego:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    first-name: System
    last-name: Admin
  storage:
    # In prod, storage paths are S3 URIs — handled by StorageService
    question-papers: ${QP_STORAGE_PATH:s3://collego-question-papers-prod/question-papers}
    assignments: ${ASSIGNMENT_STORAGE_PATH:s3://collego-assignments-prod/assignments}
    materials: ${MATERIAL_STORAGE_PATH:s3://collego-materials-prod/materials}
    resumes: ${RESUME_STORAGE_PATH:s3://collego-resumes-prod/resumes}
  aws:
    region: ${AWS_REGION:ap-south-1}
    s3-bucket: ${S3_BUCKET_NAME:collego-question-papers-prod}

logging:
  level:
    com.collego: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
