# docker-compose.prod.yml
# Production stack — uses ECR images + RDS (no local postgres container)
# All secrets injected via .env file on the EC2 instance

services:

  backend:
    image: ${ECR_REGISTRY}/collego-backend:latest
    container_name: collego-backend
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://65-0-244-196.sslip.io,https://api-65-0-244-196.sslip.io}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # S3 / AWS
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # Phase 8: Enable S3StorageService
      USE_S3: "true"
      # Per-bucket names (mapped from Phase 8 Terraform outputs)
      QP_S3_BUCKET: collego-question-papers-prod
      ASSIGNMENT_S3_BUCKET: collego-assignments-prod
      MATERIAL_S3_BUCKET: collego-materials-prod
      RESUME_S3_BUCKET: collego-resumes-prod
      MARKSHEET_S3_BUCKET: collego-marksheets-prod
      BACKUP_S3_BUCKET: collego-db-backups-prod
      # Phase 8: Backup via SSM
      EC2_INSTANCE_ID: ${EC2_INSTANCE_ID}
      # Phase 8/9: AI microservice URL (Docker internal)
      AI_SERVICE_URL: http://collego-ai-service:8000
      # Spring profile
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    expose:
      - "8080"
    networks:
      - collego-net
    logging:
      driver: awslogs
      options:
        awslogs-group: /collego/backend
        awslogs-region: ${AWS_REGION}
        awslogs-stream: backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  frontend:
    image: ${ECR_REGISTRY}/collego-frontend:latest
    container_name: collego-frontend
    restart: always
    expose:
      - "5173"
    networks:
      - collego-net
    depends_on:
      - backend
    logging:
      driver: awslogs
      options:
        awslogs-group: /collego/frontend
        awslogs-region: ${AWS_REGION}
        awslogs-stream: frontend

  ai-service:
    image: ${ECR_REGISTRY}/collego-ai-service:latest
    container_name: collego-ai-service
    restart: always
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # Phase 10: LOCAL Ollama inference — free forever, no API key, no quota, and
      # student data never leaves your infrastructure.
      # Point LLM_BASE_URL at wherever Ollama actually runs (the optional `ollama`
      # service below, a lab machine, or a GPU host). If it is unreachable the AI
      # features degrade to the deterministic Phase 9 stubs instead of failing.
      AI_ENABLED: ${AI_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5:7b-instruct}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-nomic-embed-text}
      AI_NUM_CTX: ${AI_NUM_CTX:-4096}
    expose:
      - "8000"
    networks:
      - collego-net
    logging:
      driver: awslogs
      options:
        awslogs-group: /collego/ai-service
        awslogs-region: ${AWS_REGION}
        awslogs-stream: ai-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Phase 10: optional local Ollama for AI inference. Off by default — enable on a
  # host with >= 16 GB RAM (GPU strongly preferred for the 7B model):
  #   LLM_BASE_URL=http://ollama:11434 docker compose -f docker-compose.prod.yml --profile ollama up -d
  # Then pull the model once:
  #   docker exec -it collego-ollama ollama pull qwen2.5:7b-instruct
  #   docker exec -it collego-ollama ollama pull nomic-embed-text
  # Uncomment the deploy block for NVIDIA GPU passthrough (needs
  # nvidia-container-toolkit on the host).
  ollama:
    image: ollama/ollama:latest
    container_name: collego-ollama
    restart: always
    profiles: ["ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: ${AI_NUM_CTX:-4096}
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - collego-net
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    logging:
      driver: awslogs
      options:
        awslogs-group: /collego/ollama
        awslogs-region: ${AWS_REGION}
        awslogs-stream: ollama

  nginx:
    image: nginx:alpine
    container_name: collego-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - collego-net
    depends_on:
      - backend
      - frontend
      - ai-service
    logging:
      driver: awslogs
      options:
        awslogs-group: /collego/nginx
        awslogs-region: ${AWS_REGION}
        awslogs-stream: nginx

volumes:
  ollama_models:

networks:
  collego-net:
    driver: bridge
