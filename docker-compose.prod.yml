# docker-compose.prod.yml
# Production stack — uses ECR images + RDS (no local postgres container)
# All secrets injected via .env file on the EC2 instance

services:

  backend:
    image: ${ECR_REGISTRY}/collego-backend:latest
    container_name: collego-backend
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # S3 / AWS
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # Phase 8: Enable S3StorageService
      USE_S3: "true"
      # Per-bucket names (mapped from Phase 8 Terraform outputs)
      QP_S3_BUCKET: collego-question-papers-prod
      ASSIGNMENT_S3_BUCKET: collego-assignments-prod
      MATERIAL_S3_BUCKET: collego-materials-prod
      RESUME_S3_BUCKET: collego-resumes-prod
      MARKSHEET_S3_BUCKET: collego-marksheets-prod
      BACKUP_S3_BUCKET: collego-db-backups-prod
      # Phase 8: Backup via SSM
      EC2_INSTANCE_ID: ${EC2_INSTANCE_ID}
      # Phase 8/9: AI microservice URL (Docker internal)
      AI_SERVICE_URL: http://collego-ai-service:8000
      # Spring profile
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    expose:
      - "8080"
    networks:
      - collego-net
    logging:
      driver: awslogs
      options:
        awslogs-group: /collego/backend
        awslogs-region: ${AWS_REGION}
        awslogs-stream: backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: ${ECR_REGISTRY}/collego-frontend:latest
    container_name: collego-frontend
    restart: always
    expose:
      - "5173"
    networks:
      - collego-net
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-group: /collego/frontend
        awslogs-region: ${AWS_REGION}
        awslogs-stream: frontend

  ai-service:
    image: ${ECR_REGISTRY}/collego-ai-service:latest
    container_name: collego-ai-service
    restart: always
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # Phase 9: LLM API key for AI notice generation (leave blank to use stub mode)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    expose:
      - "8000"
    networks:
      - collego-net
    logging:
      driver: awslogs
      options:
        awslogs-group: /collego/ai-service
        awslogs-region: ${AWS_REGION}
        awslogs-stream: ai-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: collego-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - collego-net
    depends_on:
      - backend
      - frontend
      - ai-service
    logging:
      driver: awslogs
      options:
        awslogs-group: /collego/nginx
        awslogs-region: ${AWS_REGION}
        awslogs-stream: nginx

networks:
  collego-net:
    driver: bridge
