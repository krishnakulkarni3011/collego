version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: collego-postgres
    environment:
      POSTGRES_DB: collego
      POSTGRES_USER: collego
      POSTGRES_PASSWORD: collego123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collego -d collego"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: collego-ai-service
    environment:
      # Phase 10: inference runs on a LOCAL Ollama server — free forever, no API
      # key, no quota, and student data never leaves this machine.
      AI_ENABLED: ${AI_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      # Default targets Ollama running natively on the host (recommended on a
      # Windows box with an NVIDIA GPU — it uses the GPU directly).
      # To run Ollama inside compose instead:
      #   docker compose --profile ollama up
      #   LLM_BASE_URL=http://ollama:11434 docker compose --profile ollama up
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5:7b-instruct}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-nomic-embed-text}
      AI_NUM_CTX: ${AI_NUM_CTX:-4096}
    extra_hosts:
      # Needed on Linux hosts so host.docker.internal resolves.
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Phase 10: optional local LLM. Enable with: docker compose --profile ollama up
  # Not started by default so it cannot fight over port 11434 with a native
  # Ollama install (the recommended setup on Windows + RTX 3060).
  ollama:
    image: ollama/ollama:latest
    container_name: collego-ollama
    profiles: ["ollama"]
    environment:
      # 6 GB VRAM: one model, trimmed context (4096) so the KV cache fits.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: ${AI_NUM_CTX:-4096}
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collego-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: collego
      DB_USERNAME: collego
      DB_PASSWORD: collego123
      JWT_SECRET: myVeryLongSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong2024
      ADMIN_EMAIL: admin@collego.edu
      ADMIN_PASSWORD: Admin@123
      # Phase 9: AI microservice URL (Docker internal network)
      collego.ai-service.url: http://collego-ai-service:8000
    ports:
      - "8081:8080"
    volumes:
      - collego_storage:/root/collego-storage
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8081
    container_name: collego-frontend
    environment:
      VITE_API_URL: http://localhost:8081
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  collego_storage:
  ollama_models:

