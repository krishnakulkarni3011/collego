version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: collego-postgres
    environment:
      POSTGRES_DB: collego
      POSTGRES_USER: collego
      POSTGRES_PASSWORD: collego123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collego -d collego"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: collego-ai-service
    environment:
      # Set OPENROUTER_API_KEY here or in a .env file for full LLM mode.
      # Leave blank to use smart stub mode (still fully functional).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-openai/gpt-4o-mini}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collego-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: collego
      DB_USERNAME: collego
      DB_PASSWORD: collego123
      JWT_SECRET: myVeryLongSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong2024
      ADMIN_EMAIL: admin@collego.edu
      ADMIN_PASSWORD: Admin@123
      # Phase 9: AI microservice URL (Docker internal network)
      collego.ai-service.url: http://collego-ai-service:8000
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: collego-frontend
    environment:
      VITE_API_URL: http://localhost:8081
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:

